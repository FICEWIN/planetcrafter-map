<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خريطة كوكب الصنعة — Planet Crafter Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2d5a27">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
<header class="topbar">
  <div class="brand">خريطة كوكب الصنعة</div>
  <div class="top-actions">
    <button id="langBtn">EN</button>
    <button id="filterBtn">تصفية 🔽</button>
    <button id="searchBtn">🔍</button>
    <button id="installBtn" hidden>تثبيت التطبيق</button>
  </div>
</header>

<main class="wrap">
  <div id="map"></div>
  <aside id="panel" class="panel">
    <h2>تفاصيل الموقع</h2>
    <div id="info"></div>
    <button id="closePanel">إغلاق</button>
  </aside>
</main>

<div id="filterModal" class="modal hidden">
  <div class="modal-box">
    <h3>تصفية الموارد</h3>
    <div id="filters"></div>
    <button id="closeFilter">تم</button>
  </div>
</div>

<div id="searchBox" class="search-box hidden">
  <input type="text" id="searchInput" placeholder="ابحث عن مورد أو موقع...">
  <ul id="searchResults"></ul>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
